name: build-windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  # ---------------------------------------------------------------- Job A ---
  # Spike A (WebView2) - the proven ADR-0001 lane. Kept byte-identical.
  spike-webview2:
    name: Phase 0 · WebView2 Spike (x64)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # MSVC v143 environment for the Ninja generator.
      # Must run BEFORE any step that touches cl/link.
      - name: Setup MSVC (v143)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Toolchain versions (informational only)
        run: |
          try   { Write-Host ("MSVC: " + (& cl 2>&1 | Select-Object -First 1)) }
          catch { Write-Host "MSVC probe failed (non-fatal): $_" }
          cmake --version | Select-Object -First 1
          ninja --version

      # The runner's preinstalled C:\vcpkg has .git stripped, so manifest-mode
      # baselines cannot be resolved from it. Replace it with a genuine shallow
      # clone; the baseline is then derived from that exact commit below.
      - name: Setup vcpkg (fresh git clone)
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT\.git")) {
            if (Test-Path "$env:VCPKG_ROOT") {
              Remove-Item -Recurse -Force "$env:VCPKG_ROOT" -ErrorAction SilentlyContinue
            }
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          }
          $sha = (git -C "$env:VCPKG_ROOT" rev-parse HEAD).Trim()
          if (-not $sha) { throw "Failed to resolve vcpkg HEAD commit" }
          Add-Content $env:GITHUB_ENV "VCPKG_BASELINE=$sha"
          Write-Host "vcpkg ready @ $sha"

      - name: Bootstrap vcpkg
        run: |
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Prime vcpkg binary-cache directory
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\vcpkg-bincache
            C:\vcpkg\downloads
          key: vcpkg-win-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-win-x64-

      # Substitute the manifest placeholder with the exact cloned vcpkg commit,
      # keeping baseline <-> port-tree consistency guaranteed by construction.
      - name: Pin vcpkg manifest baseline
        run: |
          $sha = $env:VCPKG_BASELINE
          if (-not $sha) { throw "VCPKG_BASELINE is empty" }
          (Get-Content vcpkg.json -Raw) -replace '__VCPKG_BASELINE__', $sha |
            Set-Content vcpkg.json -NoNewline
          Write-Host "Manifest baseline pinned to $sha"

      - name: Configure (manifest deps install automatically here)
        run: cmake --preset win-release

      - name: Build
        run: cmake --build --preset win-release --parallel

      - name: Stage artifacts
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item build\bin\SigmaxxPhase0-WebView2.exe artifact\
          if (Test-Path build\bin\WebView2Loader.dll) {
            Copy-Item build\bin\WebView2Loader.dll artifact\
          }
          Get-ChildItem artifact | Format-Table Name,Length

      - name: Upload Sigmaxx-Phase0-WebView2-Spike
        uses: actions/upload-artifact@v4
        with:
          name: Sigmaxx-Phase0-WebView2-Spike
          path: artifact/
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------- Job B ---
  # Spike B (CEF-OSR) - isolated experimental lane; failures here never touch
  # the ADR-0001 baseline above. First runs download ~120 MB of CEF binaries;
  # the distribution is cached between runs via the cef-dist-* key.
  spike-cef:
    name: Phase 0 · CEF-OSR Spike (x64) [experimental]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (v143)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup vcpkg (fresh git clone)
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT\.git")) {
            if (Test-Path "$env:VCPKG_ROOT") {
              Remove-Item -Recurse -Force "$env:VCPKG_ROOT" -ErrorAction SilentlyContinue
            }
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          }
          $sha = (git -C "$env:VCPKG_ROOT" rev-parse HEAD).Trim()
          if (-not $sha) { throw "Failed to resolve vcpkg HEAD commit" }
          Add-Content $env:GITHUB_ENV "VCPKG_BASELINE=$sha"
          Write-Host "vcpkg ready @ $sha"

      - name: Bootstrap vcpkg
        run: |
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Prime vcpkg binary-cache directory
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\vcpkg-bincache
            C:\vcpkg\downloads
          key: vcpkg-win-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-win-x64-

      - name: Pin vcpkg manifest baseline
        run: |
          $sha = $env:VCPKG_BASELINE
          if (-not $sha) { throw "VCPKG_BASELINE is empty" }
          (Get-Content vcpkg.json -Raw) -replace '__VCPKG_BASELINE__', $sha |
            Set-Content vcpkg.json -NoNewline
          Write-Host "Manifest baseline pinned to $sha"

      # CEF distribution (~90 MB compressed) + extracted SDK live under build/.
      - name: Cache CEF distribution
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\build\_ext\cef
          key: cef-dist-win64-stable-v1
          restore-keys: cef-dist-win64-stable-

      - name: Configure (CEF spike enabled)
        run: cmake --preset win-release -DSX_ENABLE_CEF_SPIKE=ON

      - name: Build
        run: cmake --build --preset win-release --parallel

      - name: Stage artifacts
        run: |
          New-Item -ItemType Directory -Force -Path artifact-cef | Out-Null
          Copy-Item build\bin-cef\SigmaxxPhase0-CefOsr.exe artifact-cef\
          Get-ChildItem build\bin-cef -Exclude *.pdb |
            Copy-Item -Destination artifact-cef
          Get-ChildItem artifact-cef | Format-Table Name,Length

      - name: Upload Sigmaxx-Phase0-CefOsr-Spike
        uses: actions/upload-artifact@v4
        with:
          name: Sigmaxx-Phase0-CefOsr-Spike
          path: artifact-cef/
          retention-days: 14
          if-no-files-found: error
